name: Quality CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alento"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alento?schema=public
      NEXT_PUBLIC_APP_NAME: Alentó Pizza
      NEXT_PUBLIC_APP_URL: https://alentopizza.com
      AUTH_SESSION_SECRET: ci-only-auth-session-secret-00000000000000000000000000000000
      AUTH_BOOTSTRAP_KEY: ci-only-bootstrap-key
      ORDER_TRACKING_SECRET: ci-only-order-tracking-secret-000000000000000000000000000000
      NOTIFIER_SHARED_SECRET: ci-only-notifier-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply schema to ephemeral database
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build
