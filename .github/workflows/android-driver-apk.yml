name: Alento Repartidor APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-driver/**"
      - ".github/workflows/android-driver-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android-driver
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alento-Repartidor-build-log
          path: android-driver/android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alento-Repartidor-004-debug
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
