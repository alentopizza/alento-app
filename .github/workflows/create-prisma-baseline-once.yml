name: Create Prisma baseline once

on:
  push:
    paths:
      - ".github/workflows/create-prisma-baseline-once.yml"

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alento_baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alento_baseline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alento_baseline?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Archive legacy migration history
        run: |
          test -d prisma/migrations
          test ! -e prisma/legacy-migrations
          git mv prisma/migrations prisma/legacy-migrations
          mkdir -p prisma/migrations/20261026190500_baseline
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml

      - name: Generate baseline from current schema
        run: |
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            > prisma/migrations/20261026190500_baseline/migration.sql
          test -s prisma/migrations/20261026190500_baseline/migration.sql
          wc -l prisma/migrations/20261026190500_baseline/migration.sql
          sha256sum prisma/migrations/20261026190500_baseline/migration.sql

      - name: Validate baseline with migrate deploy
        run: npx prisma migrate deploy

      - name: Verify zero schema drift
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Commit validated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations prisma/legacy-migrations
          git commit -m "chore: establish Prisma baseline migration"
          git push
