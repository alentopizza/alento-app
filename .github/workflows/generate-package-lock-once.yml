name: Validate package lock once

on:
  push:
    paths:
      - ".github/workflows/generate-package-lock-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Validate clean install
        run: npm ci --no-audit --no-fund
