name: Validate Prisma baseline once

on:
  push:
    paths:
      - ".github/workflows/validate-prisma-baseline-once.yml"

permissions:
  contents: read

jobs:
  validate-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alento_baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alento_baseline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alento_baseline?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate baseline SQL from empty database
        run: |
          rm -rf /tmp/prisma-baseline
          mkdir -p /tmp/prisma-baseline/migrations/20261026190500_baseline
          printf 'provider = "postgresql"\n' > /tmp/prisma-baseline/migrations/migration_lock.toml
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            > /tmp/prisma-baseline/migrations/20261026190500_baseline/migration.sql
          test -s /tmp/prisma-baseline/migrations/20261026190500_baseline/migration.sql
          wc -l /tmp/prisma-baseline/migrations/20261026190500_baseline/migration.sql
          sha256sum /tmp/prisma-baseline/migrations/20261026190500_baseline/migration.sql

      - name: Replace migration history only inside runner
        run: |
          rm -rf prisma/migrations
          cp -R /tmp/prisma-baseline/migrations prisma/migrations

      - name: Deploy baseline to empty PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify zero schema drift after baseline
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
