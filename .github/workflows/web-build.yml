name: Web production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      AUTH_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_BOOTSTRAP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ORDER_TRACKING_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NOTIFIER_SHARED_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: build-placeholder
      GOOGLE_MAPS_SERVER_API_KEY: build-placeholder
      WEB_PUSH_VAPID_SUBJECT: mailto:build@example.com
      WEB_PUSH_VAPID_PUBLIC_KEY: build-placeholder
      WEB_PUSH_VAPID_PRIVATE_KEY: build-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
